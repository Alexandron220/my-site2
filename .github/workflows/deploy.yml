name: Deploy to Yandex Cloud Object Storage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to Yandex Cloud S3
        uses: yc-actions/yc-s3-upload@v1
        with:
          # Используем статические ключи
          access-key-id: ${{ secrets.YC_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          bucket: ${{ secrets.BUCKET }}
          # Папка для загрузки (корень репозитория)
          source-dir: ./
          # Очищать бакет перед загрузкой (осторожно, удалит всё в бакете!)
          clear: true
